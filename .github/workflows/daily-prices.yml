name: Daily price update

on:
  schedule:
    # 8 AM New York: select the correct UTC hour using the DST gate below.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Select 8 AM New York schedule
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          expected="0 13 * * *"
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then
            expected="0 12 * * *"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$SCHEDULE" = "$expected" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  update:
    needs: schedule-check
    if: needs.schedule-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check required credentials
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ] || [ -z "$ALPHAVANTAGE_API_KEY" ]; then
            echo "::error::Add FRED_API_KEY and ALPHAVANTAGE_API_KEY in repository Actions secrets."
            exit 1
          fi
      - name: Fetch latest prices
        id: sync
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python -m financial_dashboard.sync --daily
      - name: Publish updated database snapshot
        run: |
          if git diff --quiet -- data/market.db; then
            echo "No database changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market.db
          git commit -m "Update daily market data"
          # Preserve a concurrent main-branch update; never force-push.
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report partial source failures
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::One or more sources failed. Successful updates were published; inspect the fetch logs."
          exit 1
